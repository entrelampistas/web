<header class="cabecera cabecera--pieza" aria-label="Cabecera de la pieza">
  <div class="cabecera__izq">
    {{?cerrar}}<a class="icono-btn" href="{{volver}}" data-volver aria-label="salir · se guarda lo respondido" title="salir · se guarda lo respondido"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></a>{{/cerrar}}
    {{!cerrar}}<a class="icono-btn" href="{{volver}}" data-volver aria-label="volver"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="10,6 4,12 10,18"/></svg></a>{{/cerrar}}
    <span class="mono cabecera__ruta" data-ruta>{{ruta}}</span>
  </div>
  <div class="cabecera__der">
    {{?meta}}<span class="mono cabecera__meta" data-meta>{{meta}}</span>{{/meta}}
    {{?tema}}<a class="icono-btn" href="{{tema}}" aria-label="Ver el tema"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5.25"/><line x1="12" y1="2" x2="12" y2="6.75"/></svg></a>{{/tema}}
    {{?guardar}}<button class="icono-btn" type="button" aria-pressed="false" aria-label="Guardar en este dispositivo" data-guardar="{{guardar}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.75" y="6.75" width="10.5" height="10.5"/></svg></button>{{/guardar}}
    {{?compartir}}<button class="icono-btn" type="button" aria-label="Compartir" data-compartir><svg viewBox="0 0 14 14" aria-hidden="true" style="width:18px;height:18px"><polyline points="7,9 7,1"/><polyline points="3.5,4.5 7,1 10.5,4.5"/><polyline points="1,8 1,13 13,13 13,8"/></svg></button>{{/compartir}}
    {{?indice}}<a class="icono-btn" href="#indice-ensayo" aria-label="Índice del ensayo" data-indice-ensayo><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="13" y2="14"/></svg></a>{{/indice}}
  </div>
  {{?progreso}}<div class="cabecera__progreso" data-progreso aria-hidden="true"></div>{{/progreso}}
</header>
