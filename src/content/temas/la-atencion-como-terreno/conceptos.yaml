entradas:
  - termino: Atención
    definicion: >-
      Capacidad de sostener un foco durante un tiempo. Se comporta menos como un
      recurso que se agota y más como un terreno que toma la forma de lo que se
      construye encima.

  - termino: Carga cognitiva
    definicion: >-
      Cantidad de trabajo mental que exige una tarea. No coincide con la
      dificultad percibida: una actividad fácil e interrumpida puede cargar más
      que una difícil y continua.

  - termino: Fragmentación
    definicion: >-
      Corte repetido de una actividad antes de que llegue a completarse. Su coste
      no está en el tiempo perdido sino en el que hace falta para volver a
      entrar.

  - termino: Profundidad
    definicion: >-
      Capacidad de sostener una idea durante el tiempo que necesita para
      desarrollarse. Se entrena y se pierde, y no siempre en la misma escala de
      tiempo.
