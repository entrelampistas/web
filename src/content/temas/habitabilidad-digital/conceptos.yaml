entradas:
  - termino: Habitabilidad digital
    definicion: >-
      Condición de un espacio digital que permite estar en él sin deterioro. Se
      mide como se mide la de una vivienda: si hay luz, si el ruido deja pensar,
      si uno puede irse cuando quiere.

  - termino: Entorno
    definicion: >-
      Lugar donde se vive, por oposición a herramienta, que es algo que se usa y
      se deja. La diferencia no es de intensidad sino de naturaleza: en un
      entorno hay vecinos, normas y horarios, aunque nadie los haya escrito.

  - termino: Economía de la atención
    definicion: >-
      Modelo de negocio en el que el producto vendido es el tiempo y el foco de
      quien mira. No exige mala intención por parte de nadie para producir sus
      efectos: basta con que la métrica premiada sea la permanencia.

  - termino: Fricción de salida
    definicion: >-
      Coste de abandonar un espacio digital: contactos que quedan dentro,
      historial que no se puede llevar, conversaciones que siguen sin uno. Cuanto
      más alta, menos voluntaria es la permanencia.

  - termino: Diseño persuasivo
    definicion: >-
      Conjunto de decisiones de interfaz orientadas a modificar la conducta de
      quien la usa en una dirección concreta. El desplazamiento infinito es el
      ejemplo más conocido, no el único.

  - termino: Colonización cognitiva
    definicion: >-
      Ocupación progresiva de la atención, el vocabulario y las intuiciones de
      alguien por parte de un entorno que no eligió. Se reconoce tarde, porque
      lo colonizado deja de parecer externo.
